<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Parallel — Chess</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Kalam:wght@300;400;700&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #faf8f3;
  --ink: #2c2a27;
  --ink-soft: #7a746a;
  --line: #d3ccbe;
  --accent: #3b6ea5;
  --card: #fffefa;
  --sq-light: #f0ebe1;
  --sq-dark: #c9b49a;
  --hand: 'Kalam', cursive;
  --disp: 'Architects Daughter', cursive;
}
[data-theme="grey"] { --sq-light: #e8e8e8; --sq-dark: #b0b0b0; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--hand);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

/* top bar */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 20px; padding: 22px 30px 12px; flex-wrap: nowrap;
}
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand-name {
  font-family: var(--disp); font-size: 34px; line-height: 1;
  color: var(--ink); letter-spacing: .5px;
}
.brand-sub { font-size: 16px; color: var(--ink-soft); }
.games-live {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--disp); font-size: 13px; color: var(--ink-soft);
  background: rgba(44,42,39,.06); padding: 3px 10px; border-radius: 20px;
}
.livecount {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 15px; color: var(--ink-soft);
}
.live-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent); animation: pulse 1.8s infinite;
}
.live-dot.dim { background: var(--line); animation: none; }
@keyframes pulse {
  0%   { box-shadow: 0 0 0 0 color-mix(in oklab, var(--accent) 55%, transparent); }
  70%  { box-shadow: 0 0 0 7px transparent; }
  100% { box-shadow: 0 0 0 0 transparent; }
}
.divider { border: none; border-top: 1.5px dashed var(--line); margin: 0 18px; }

/* card */
.card { background: var(--card); }
[data-sketch="on"] .card {
  border: 1.7px solid var(--ink);
  border-radius: 15px 11px 16px 12px / 11px 15px 12px 14px;
  box-shadow: 2px 3px 0 rgba(44,42,39,.08);
}
[data-sketch="off"] .card {
  border: 1px solid var(--line);
  border-radius: 10px;
  box-shadow: 0 1px 2px rgba(44,42,39,.04);
}

/* board */
.board {
  width: 100%; aspect-ratio: 1/1;
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  grid-template-rows: repeat(8, 1fr);
  container-type: size; overflow: hidden;
}
.board-frame { border-radius: 6px; overflow: hidden; box-shadow: 0 2px 14px rgba(0,0,0,.13); }
.board-frame.in-check-ring { box-shadow: 0 0 0 3px #c85a3a, 0 2px 14px rgba(0,0,0,.13); }
.sq {
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; position: relative; transition: background .07s;
}
.sq.l { background: var(--sq-light); }
.sq.d { background: var(--sq-dark); }
.sq.selected { background: #9bc96d !important; }
.sq.last-move { background: color-mix(in oklab, var(--sq-light) 40%, #c8c058) !important; }
.sq.d.last-move { background: color-mix(in oklab, var(--sq-dark) 40%, #b8b050) !important; }
.sq.legal-dot::after {
  content: ''; position: absolute;
  width: 30%; height: 30%; border-radius: 50%;
  background: rgba(44,42,39,.22); pointer-events: none;
}
.sq.legal-capture::after {
  content: ''; position: absolute; inset: 0; border-radius: 50%;
  box-shadow: inset 0 0 0 4px rgba(44,42,39,.22); pointer-events: none;
}
.sq.in-check { background: #c85a3a !important; }
.pc { font-size: 12cqw; line-height: 1; user-select: none; pointer-events: none; position: relative; z-index: 1; }
.pc.w { color: #fff; -webkit-text-stroke: 1.5px rgba(0,0,0,.75); }
.pc.b { color: #1a1816; -webkit-text-stroke: 0; }
@keyframes pc-slide {
  from { transform: var(--pc-from, none); }
  to   { transform: none; }
}
.pc.sliding { animation: pc-slide 0.2s ease-out both; }

/* advantage bar */
.board-with-bar {
  display: flex; gap: 10px; align-items: stretch; width: 100%;
}
.adv-bar {
  flex: 0 0 8px; border-radius: 4px; overflow: hidden;
  display: flex; flex-direction: column; min-height: 0;
}
.adv-b { background: #1a1816; transition: height .4s ease; }
.adv-w { background: #ddd8d0; transition: height .4s ease; }
.board-wrap { flex: 1; min-width: 0; }

/* lobby */
.lobby-wrap {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; min-height: 60vh; gap: 0; padding: 0 30px;
}
.lobby-card {
  padding: 28px 32px; display: flex; flex-direction: column;
  gap: 14px; width: 100%; max-width: 340px; align-items: center;
}
.lobby-title { font-family: var(--disp); font-size: 18px; color: var(--ink-soft); }
.lobby-hr { width: 100%; border: none; border-top: 1.5px dashed var(--line); margin: 2px 0; }
.join-row { display: flex; gap: 8px; width: 100%; }
.inp {
  font-family: var(--disp); flex: 1; padding: 10px 12px;
  border: 1.5px solid var(--line); border-radius: 8px;
  background: var(--card); color: var(--ink); font-size: 14px; outline: none;
}
.inp:focus { border-color: var(--accent); }
.inp::placeholder { color: var(--ink-soft); }

/* buttons */
.btn {
  font-family: var(--hand); cursor: pointer; border: none;
  padding: 10px 24px; border-radius: 9px 8px 10px 7px;
  font-size: 16px; transition: opacity .15s;
}
.btn:hover { opacity: .85; }
.btn-primary { background: var(--accent); color: #fff; width: 100%; }
.btn-outline {
  background: transparent; color: var(--accent);
  border: 1.5px solid var(--accent); padding: 10px 18px; border-radius: 9px 8px 10px 7px;
}

/* game layout */
.game-wrap {
  display: flex; flex-direction: column; align-items: center;
  gap: 12px; padding: 16px 30px 60px;
}
.board-area { width: 100%; max-width: 480px; }

/* player row */
.player-row {
  width: 100%; max-width: 480px;
  display: flex; align-items: center; gap: 10px;
  font-size: 17px; padding: 8px 14px;
}
.turn-dot {
  width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto;
  border: 1.5px solid var(--line); background: transparent; transition: background .2s;
}
.player-row.active .turn-dot { background: var(--accent); border-color: var(--accent); }
.player-row.active .pname { font-weight: 700; }
.pname { flex: 1; }
.ptag { font-size: 13px; color: var(--ink-soft); font-family: var(--disp); }

/* share strip */
.share-strip {
  display: flex; align-items: center; gap: 10px;
  font-size: 14px; color: var(--ink-soft);
  padding: 8px 16px; width: 100%; max-width: 480px;
}
.share-code {
  font-family: var(--disp); background: var(--bg);
  padding: 3px 10px; border-radius: 5px;
  border: 1px solid var(--line); letter-spacing: 1px; font-size: 14px; color: var(--ink);
}
.copy-btn {
  background: none; border: none; cursor: pointer;
  color: var(--ink-soft); font-size: 18px; line-height: 1; padding: 0 2px;
  font-family: inherit;
}
.copy-btn:hover { color: var(--accent); }

/* status badge */
.status-badge {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--disp); font-size: 13px; letter-spacing: .3px;
  padding: 5px 14px; border-radius: 20px;
}
.status-badge.waiting   { background: rgba(44,42,39,.06); color: var(--ink-soft); }
.status-badge.ongoing   { background: rgba(50,130,80,.12); color: #3a7a4a; }
.status-badge.check     { background: rgba(200,90,58,.12); color: #c85a3a; }
.status-badge.checkmate { background: rgba(200,90,58,.15); color: #c85a3a; }
.status-badge.stalemate { background: rgba(200,160,60,.12); color: #8a6a20; }

/* message */
.msg { font-size: 14px; min-height: 20px; color: var(--ink-soft); text-align: center; }
.msg.err { color: #c85a3a; }
.msg.ok  { color: #3a7a4a; }

/* tweaks panel (from design) */
.twk-panel {
  position: fixed; right: 16px; bottom: 16px; z-index: 9999; width: 272px;
  max-height: calc(100vh - 32px); display: flex; flex-direction: column;
  background: rgba(250,249,247,.85); color: #29261b;
  -webkit-backdrop-filter: blur(24px) saturate(160%);
  backdrop-filter: blur(24px) saturate(160%);
  border: .5px solid rgba(255,255,255,.6); border-radius: 14px;
  box-shadow: 0 1px 0 rgba(255,255,255,.5) inset, 0 12px 40px rgba(0,0,0,.18);
  font: 11.5px/1.4 ui-sans-serif, system-ui, sans-serif; overflow: hidden;
}
.twk-hd {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 8px 10px 14px; cursor: move; user-select: none;
  border-bottom: .5px solid rgba(0,0,0,.07);
}
.twk-hd b { font-size: 12px; font-weight: 600; }
.twk-x {
  appearance: none; border: 0; background: transparent;
  color: rgba(41,38,27,.55); width: 22px; height: 22px;
  border-radius: 6px; cursor: pointer; font-size: 13px; line-height: 22px; text-align: center;
}
.twk-x:hover { background: rgba(0,0,0,.06); color: #29261b; }
.twk-body {
  padding: 10px 14px 14px; display: flex; flex-direction: column; gap: 10px;
  overflow-y: auto; min-height: 0;
}
.twk-sect {
  font-size: 10px; font-weight: 600; letter-spacing: .06em;
  text-transform: uppercase; color: rgba(41,38,27,.45); padding-top: 6px;
}
.twk-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.twk-lbl { font-weight: 500; color: rgba(41,38,27,.72); }
.twk-toggle {
  position: relative; width: 32px; height: 18px; border: 0;
  border-radius: 999px; background: rgba(0,0,0,.15); transition: background .15s;
  cursor: pointer; padding: 0;
}
.twk-toggle[data-on="1"] { background: #34c759; }
.twk-toggle i {
  position: absolute; top: 2px; left: 2px; width: 14px; height: 14px;
  border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25);
  transition: transform .15s; display: block;
}
.twk-toggle[data-on="1"] i { transform: translateX(14px); }
.twk-seg {
  position: relative; display: flex; padding: 2px; border-radius: 8px;
  background: rgba(0,0,0,.06); user-select: none; flex: 1;
}
.twk-seg-thumb {
  position: absolute; top: 2px; bottom: 2px; border-radius: 6px;
  background: rgba(255,255,255,.9); box-shadow: 0 1px 2px rgba(0,0,0,.12);
  transition: left .15s cubic-bezier(.3,.7,.4,1), width .15s;
}
.twk-seg button {
  appearance: none; position: relative; z-index: 1; flex: 1; border: 0;
  background: transparent; color: inherit; font: inherit; font-weight: 500;
  min-height: 22px; border-radius: 6px; cursor: pointer; padding: 4px 6px;
}
.twk-chips { display: flex; gap: 6px; }
.twk-chip {
  position: relative; appearance: none; flex: 1; height: 28px; padding: 0;
  border: 0; border-radius: 6px; overflow: hidden; cursor: pointer;
  box-shadow: 0 0 0 .5px rgba(0,0,0,.12); transition: box-shadow .12s;
}
.twk-chip[data-on="1"] { box-shadow: 0 0 0 2px rgba(0,0,0,.85); }
.twk-open-btn {
  position: fixed; right: 16px; bottom: 16px; z-index: 9998;
  appearance: none; border: 0; width: 38px; height: 38px;
  border-radius: 50%; background: var(--ink); color: var(--bg);
  font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 14px rgba(0,0,0,.22);
}
.twk-open-btn:hover { opacity: .85; }

/* auth */
.auth-box { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.avatar { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--line); }
.auth-name { font-size: 15px; }
.linklike {
  background: none; border: none; cursor: pointer; padding: 0;
  color: var(--ink-soft); font-family: var(--hand); font-size: 14px; text-decoration: underline;
}
.linklike:hover { color: var(--accent); }
.gsi-wrap { display: flex; justify-content: center; width: 100%; min-height: 40px; }
.lobby-or { font-size: 13px; color: var(--ink-soft); font-family: var(--disp); }

/* captured pieces */
.cap-row { display: flex; align-items: center; gap: 2px; font-size: 17px; line-height: 1; min-height: 19px; }
.cap-pc.w { color: #fff; -webkit-text-stroke: 1px rgba(0,0,0,.75); }
.cap-pc.b { color: #1a1816; }
.cap-adv { font-family: var(--disp); font-size: 13px; color: var(--ink-soft); margin-left: 6px; }

/* game history */
.hist-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 24px 30px 60px; }
.hist-card { width: 100%; max-width: 480px; padding: 18px 20px; display: flex; flex-direction: column; gap: 4px; }
.hist-title {
  font-family: var(--disp); font-size: 18px; color: var(--ink-soft);
  display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;
}
.hist-row {
  display: flex; align-items: center; gap: 10px; padding: 10px 8px;
  border-bottom: 1.5px dashed var(--line); cursor: pointer; font-size: 15px;
}
.hist-row:last-child { border-bottom: none; }
.hist-row:hover { background: rgba(44,42,39,.04); }
.hist-opp { flex: 1; }
.hist-date { font-size: 12.5px; color: var(--ink-soft); font-family: var(--disp); }
.hist-result { font-family: var(--disp); font-size: 12px; padding: 3px 10px; border-radius: 20px; white-space: nowrap; }
.hist-result.win { background: rgba(50,130,80,.12); color: #3a7a4a; }
.hist-result.loss { background: rgba(200,90,58,.12); color: #c85a3a; }
.hist-result.draw { background: rgba(200,160,60,.12); color: #8a6a20; }
.hist-result.abandoned { background: rgba(44,42,39,.06); color: var(--ink-soft); }

/* replay */
.replay-controls { display: flex; align-items: center; gap: 8px; }
.replay-btn {
  font-family: var(--hand); cursor: pointer; background: transparent;
  color: var(--accent); border: 1.5px solid var(--accent);
  padding: 6px 14px; border-radius: 9px 8px 10px 7px; font-size: 15px;
}
.replay-btn:hover { opacity: .8; }
.replay-btn:disabled { opacity: .35; cursor: default; }
.replay-count { font-family: var(--disp); font-size: 14px; color: var(--ink-soft); min-width: 64px; text-align: center; }

@media (max-width: 520px) {
  .topbar { padding: 12px 14px 8px; gap: 8px; align-items: center; }
  .brand-name { font-size: 22px; }
  .brand-sub { font-size: 13px; }
  .games-live { font-size: 11px; padding: 2px 7px; gap: 4px; }
  .auth-box { gap: 6px; }
  .auth-name { display: none; }
  .avatar { width: 26px; height: 26px; }
  /* hide "connected"/"offline" label, keep only the dot */
  .livecount { font-size: 0; gap: 0; }
  .divider { margin: 0 12px; }
  .game-wrap { padding: 10px 12px 50px; }
  .board-area { max-width: 100%; }
  .player-row { max-width: 100%; }
  .share-strip { max-width: 100%; }
  .lobby-wrap { padding: 0 14px; }
  .lobby-card { padding: 18px 16px; }
}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ── Piece glyphs ─────────────────────────────────────────────────────────────
const GLYPH = {
  white: { king:'♚', queen:'♛', rook:'♜', bishop:'♝', knight:'♞', pawn:'♟' },
  black: { king:'♚', queen:'♛', rook:'♜', bishop:'♝', knight:'♞', pawn:'♟' },
};

// ── TweaksPanel (adapted from design) ────────────────────────────────────────
function Toggle({ value, onChange }) {
  return (
    <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
            onClick={() => onChange(!value)}>
      <i />
    </button>
  );
}

function SegRadio({ value, options, onChange }) {
  const n = options.length;
  const idx = Math.max(0, options.indexOf(value));
  return (
    <div className="twk-seg" style={{ flex: 1 }}>
      <div className="twk-seg-thumb"
           style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                    width: `calc((100% - 4px) / ${n})` }} />
      {options.map((o) => (
        <button key={o} type="button" onClick={() => onChange(o)}>{o}</button>
      ))}
    </div>
  );
}

function ColorChips({ value, options, onChange }) {
  return (
    <div className="twk-chips">
      {options.map((c) => (
        <button key={c} type="button" className="twk-chip"
                data-on={value === c ? '1' : '0'}
                style={{ background: c }} onClick={() => onChange(c)} />
      ))}
    </div>
  );
}

function TweaksPanel({ tweaks, setTweak }) {
  const [open, setOpen] = useState(false);
  const dragRef = useRef(null);
  const posRef = useRef({ right: 16, bottom: 64 });

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight  = window.innerWidth  - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      posRef.current = {
        right:  Math.max(8, startRight  - (ev.clientX - sx)),
        bottom: Math.max(8, startBottom - (ev.clientY - sy)),
      };
      panel.style.right  = posRef.current.right  + 'px';
      panel.style.bottom = posRef.current.bottom + 'px';
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) {
    return (
      <button className="twk-open-btn" title="Tweaks" onClick={() => setOpen(true)}>⚙</button>
    );
  }

  return (
    <div ref={dragRef} className="twk-panel"
         style={{ right: posRef.current.right, bottom: posRef.current.bottom }}>
      <div className="twk-hd" onMouseDown={onDragStart}>
        <b>Tweaks</b>
        <button className="twk-x" onMouseDown={e => e.stopPropagation()}
                onClick={() => setOpen(false)}>✕</button>
      </div>
      <div className="twk-body">
        <div className="twk-sect">Look</div>
        <div className="twk-row">
          <span className="twk-lbl">Accent</span>
          <ColorChips value={tweaks.accent}
            options={['#3b6ea5', '#5a8f5a', '#c08a2e', '#2c2a27']}
            onChange={v => setTweak('accent', v)} />
        </div>
        <div className="twk-row">
          <span className="twk-lbl">Board tone</span>
          <SegRadio value={tweaks.theme} options={['warm', 'grey']}
            onChange={v => setTweak('theme', v)} />
        </div>
        <div className="twk-row">
          <span className="twk-lbl">Hand-drawn frames</span>
          <Toggle value={tweaks.sketch} onChange={v => setTweak('sketch', v)} />
        </div>
      </div>
    </div>
  );
}

// ── Google sign-in ────────────────────────────────────────────────────────────
function GoogleButton({ clientId, onUser, onError }) {
  const ref = useRef(null);
  useEffect(() => {
    if (!clientId) return;
    let cancelled = false;
    const tryInit = () => {
      if (cancelled) return;
      if (!(window.google && window.google.accounts && window.google.accounts.id)) {
        setTimeout(tryInit, 200); // GIS script still loading
        return;
      }
      window.google.accounts.id.initialize({
        client_id: clientId,
        callback: async (resp) => {
          try {
            const r = await fetch('/auth/google', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ credential: resp.credential }),
            });
            const data = await r.json();
            if (r.ok) onUser(data.user);
            else onError(data.error || 'Sign-in failed.');
          } catch {
            onError('Sign-in failed.');
          }
        },
      });
      window.google.accounts.id.renderButton(ref.current, {
        theme: 'outline', size: 'large', shape: 'pill', text: 'signin_with',
      });
    };
    tryInit();
    return () => { cancelled = true; };
  }, [clientId]);
  return <div className="gsi-wrap"><div ref={ref} /></div>;
}

// ── Captured pieces ───────────────────────────────────────────────────────────
function capScore(pieces) {
  return (pieces || []).reduce((s, t) => s + (PIECE_VALUE[t] || 0), 0);
}

// `pieces` were captured by one side, so they belong to `victimColor`.
function CapturedRow({ pieces, victimColor, adv }) {
  return (
    <span className="cap-row">
      {(pieces || []).map((t, i) => (
        <span key={i} className={`cap-pc ${victimColor === 'white' ? 'w' : 'b'}`}>
          {GLYPH[victimColor][t]}
        </span>
      ))}
      {adv > 0 && <span className="cap-adv">+{adv}</span>}
    </span>
  );
}

// ── Replay helpers ────────────────────────────────────────────────────────────
// Mirrors Board::new() on the server: row 0 = black back rank, row 7 = white.
function startBoard() {
  const back = ['rook','knight','bishop','queen','king','bishop','knight','rook'];
  const b = Array(8).fill(null).map(() => Array(8).fill(null));
  back.forEach((t, c) => {
    b[0][c] = { type: t, color: 'black' };
    b[7][c] = { type: t, color: 'white' };
  });
  for (let c = 0; c < 8; c++) {
    b[1][c] = { type: 'pawn', color: 'black' };
    b[6][c] = { type: 'pawn', color: 'white' };
  }
  return b;
}

// The engine has no castling/en passant/promotion yet, so replaying a move is
// just "piece slides from -> to" with any capture implied by the target square.
function boardAfter(moves, n) {
  const b = startBoard();
  for (let i = 0; i < n; i++) {
    const m = moves[i];
    b[m.to.x][m.to.y] = b[m.from.x][m.from.y];
    b[m.from.x][m.from.y] = null;
  }
  return b;
}

// ── Material advantage ────────────────────────────────────────────────────────
const PIECE_VALUE = { queen: 9, rook: 5, bishop: 3, knight: 3, pawn: 1, king: 0 };
function materialAdv(board) {
  let b = 0, w = 0;
  for (let r = 0; r < 8; r++)
    for (let c = 0; c < 8; c++) {
      const p = board[r][c];
      if (!p) continue;
      if (p.color === 'black') b += PIECE_VALUE[p.type] || 0;
      else w += PIECE_VALUE[p.type] || 0;
    }
  const total = b + w || 1;
  return { bPct: (b / total) * 100, wPct: (w / total) * 100 };
}

// ── Board component ───────────────────────────────────────────────────────────
function Board({ board, myColor, turn, status, selected, legalMoves, lastMove, onSquareClick }) {
  const flip = myColor === 'black';
  const legalSet = new Set((legalMoves || []).map(m => `${m.x},${m.y}`));

  // Compute animation info synchronously during render when lastMove changes
  const prevLastMoveRef = React.useRef(null);
  const animRef = React.useRef(null);
  if (lastMove !== prevLastMoveRef.current) {
    prevLastMoveRef.current = lastMove;
    if (lastMove) {
      const { from, to } = lastMove;
      const fvr = flip ? 7 - from.x : from.x;
      const fvc = flip ? 7 - from.y : from.y;
      const tvr = flip ? 7 - to.x   : to.x;
      const tvc = flip ? 7 - to.y   : to.y;
      animRef.current = { key: `${to.x},${to.y}`, dx: fvc - tvc, dy: fvr - tvr };
    }
  }
  const anim = animRef.current;

  let kingCheckSq = null;
  if (status === 'check' || status === 'checkmate') {
    for (let r = 0; r < 8; r++) {
      for (let c = 0; c < 8; c++) {
        const p = board[r][c];
        if (p && p.type === 'king' && p.color === turn) kingCheckSq = `${r},${c}`;
      }
    }
  }

  const order = flip ? [7,6,5,4,3,2,1,0] : [0,1,2,3,4,5,6,7];
  const cells = [];
  for (const row of order) {
    for (const col of order) {
      const key = `${row},${col}`;
      const piece = board[row][col];
      const isLight = (row + col) % 2 === 0;

      let cls = 'sq ' + (isLight ? 'l' : 'd');
      if (selected && selected.row === row && selected.col === col) {
        cls += ' selected';
      } else if (kingCheckSq === key) {
        cls += ' in-check';
      } else if (lastMove &&
          ((lastMove.from.x === row && lastMove.from.y === col) ||
           (lastMove.to.x   === row && lastMove.to.y   === col))) {
        cls += ' last-move';
      }
      if (legalSet.has(key)) cls += piece ? ' legal-capture' : ' legal-dot';

      const isAnim = anim && anim.key === key;
      cells.push(
        <div key={key} className={cls}
             style={isAnim ? { zIndex: 100 } : undefined}
             onClick={() => onSquareClick(row, col)}>
          {piece && (
            <span className={`pc ${piece.color === 'white' ? 'w' : 'b'}${isAnim ? ' sliding' : ''}`}
                  style={isAnim ? { '--pc-from': `translate(${anim.dx * 12.5}cqw, ${anim.dy * 12.5}cqw)` } : undefined}>
              {GLYPH[piece.color][piece.type]}
            </span>
          )}
        </div>
      );
    }
  }

  const inCheck = status === 'check' || status === 'checkmate';
  return (
    <div className={`board-frame ${inCheck ? 'in-check-ring' : ''}`}>
      <div className="board">{cells}</div>
    </div>
  );
}

// ── Lobby ─────────────────────────────────────────────────────────────────────
function Lobby({ onCreate, onJoin, msg, user, clientId, onUser, onAuthError, onMyGames }) {
  const [gid, setGid] = useState('');
  return (
    <div className="lobby-wrap">
      <div className="card lobby-card">
        {!user && clientId && (
          <>
            <GoogleButton clientId={clientId} onUser={onUser} onError={onAuthError} />
            <div className="lobby-or">— or play as a guest —</div>
          </>
        )}
        <div className="lobby-title">start a game</div>
        <button className="btn btn-primary" onClick={onCreate}>Create Game</button>
        <hr className="lobby-hr" />
        <div className="join-row">
          <input className="inp" placeholder="Game ID" maxLength={8}
            value={gid} onChange={e => setGid(e.target.value)}
            onKeyDown={e => e.key === 'Enter' && gid.trim() && onJoin(gid.trim())} />
          <button className="btn btn-outline"
            onClick={() => gid.trim() && onJoin(gid.trim())}>Join</button>
        </div>
        {user && (
          <>
            <hr className="lobby-hr" />
            <button className="linklike" onClick={onMyGames}>my games →</button>
          </>
        )}
        {msg && <div className={`msg ${msg.err ? 'err' : 'ok'}`}>{msg.text}</div>}
      </div>
    </div>
  );
}

// ── My games (history) ────────────────────────────────────────────────────────
function resultInfo(g) {
  if (g.result === 'draw') return { label: 'draw', cls: 'draw' };
  if (g.result === 'abandoned') return { label: 'abandoned', cls: 'abandoned' };
  const won = (g.result === 'white_won') === (g.your_color === 'white');
  return won ? { label: 'won', cls: 'win' } : { label: 'lost', cls: 'loss' };
}

function MyGames({ onBack, onReplay }) {
  const [games, setGames] = useState(null);
  const [err, setErr] = useState(null);
  useEffect(() => {
    fetch('/api/games')
      .then(r => { if (!r.ok) throw new Error(); return r.json(); })
      .then(d => setGames(d.games))
      .catch(() => setErr('Could not load your games.'));
  }, []);

  return (
    <div className="hist-wrap">
      <div className="card hist-card">
        <div className="hist-title">
          <span>my games</span>
          <button className="linklike" onClick={onBack}>← back</button>
        </div>
        {err && <div className="msg err">{err}</div>}
        {!err && games === null && <div className="msg">Loading…</div>}
        {games && games.length === 0 && <div className="msg">No games yet — finish a game while signed in.</div>}
        {games && games.map(g => {
          const opp = g.your_color === 'white'
            ? (g.black_name || 'Anonymous') : (g.white_name || 'Anonymous');
          const res = resultInfo(g);
          return (
            <div key={g.id} className="hist-row" onClick={() => onReplay(g)}>
              <span className="hist-opp">
                vs {opp} <span className="hist-date">as {g.your_color} · {g.moves.length} moves</span>
              </span>
              <span className="hist-date">{new Date(g.created_at).toLocaleDateString()}</span>
              <span className={`hist-result ${res.cls}`}>{res.label}</span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── Replay viewer ─────────────────────────────────────────────────────────────
function Replay({ game, onBack }) {
  const total = game.moves.length;
  const [idx, setIdx] = useState(0);
  const board = boardAfter(game.moves, idx);
  const lastMove = idx > 0
    ? { from: game.moves[idx - 1].from, to: game.moves[idx - 1].to }
    : null;
  const res = resultInfo(game);

  useEffect(() => {
    const onKey = (e) => {
      if (e.key === 'ArrowRight') setIdx(i => Math.min(total, i + 1));
      if (e.key === 'ArrowLeft') setIdx(i => Math.max(0, i - 1));
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [total]);

  return (
    <div className="game-wrap">
      <div className="card player-row">
        <span className="pname">
          {game.white_name || 'Anonymous'} vs {game.black_name || 'Anonymous'}
        </span>
        <span className={`hist-result ${res.cls}`}>{res.label}</span>
      </div>
      <div className="board-area">
        <Board board={board} myColor={game.your_color} turn={null} status="replay"
          selected={null} legalMoves={[]} lastMove={lastMove} onSquareClick={() => {}} />
      </div>
      <div className="replay-controls">
        <button className="replay-btn" disabled={idx === 0} onClick={() => setIdx(0)}>⏮</button>
        <button className="replay-btn" disabled={idx === 0}
          onClick={() => setIdx(i => Math.max(0, i - 1))}>◀</button>
        <span className="replay-count">{idx} / {total}</span>
        <button className="replay-btn" disabled={idx === total}
          onClick={() => setIdx(i => Math.min(total, i + 1))}>▶</button>
        <button className="replay-btn" disabled={idx === total}
          onClick={() => setIdx(total)}>⏭</button>
      </div>
      <button className="linklike" onClick={onBack}>← back to my games</button>
    </div>
  );
}

// ── GameView ──────────────────────────────────────────────────────────────────
function GameView({ myColor, turn, status, board, selected, legalMoves, lastMove,
                    gameId, gameStarted, msg, players, captured, user,
                    onSquareClick, onNewGame, onCopy }) {
  const opponentColor = myColor === 'white' ? 'black' : 'white';
  const myTurn = turn === myColor;
  const gameOver = status === 'checkmate' || status === 'stalemate';

  const oppName = (players && players[opponentColor]) || opponentColor;
  const myName = (players && players[myColor]) || (user ? user.name : myColor);
  const capScores = {
    white: capScore(captured && captured.white),
    black: capScore(captured && captured.black),
  };
  const advFor = (color) =>
    Math.max(0, capScores[color] - capScores[color === 'white' ? 'black' : 'white']);

  const statusLabel = {
    waiting:   'Waiting for opponent…',
    ongoing:   myTurn ? 'Your turn' : `${turn}'s turn`,
    check:     myTurn ? '⚠ You are in check' : `⚠ ${turn} is in check`,
    checkmate: turn === 'white' ? 'Black wins — Checkmate' : 'White wins — Checkmate',
    stalemate: 'Stalemate — Draw',
  }[status] || '';

  return (
    <div className="game-wrap">
      {/* opponent */}
      <div className={`card player-row ${!myTurn && gameStarted ? 'active' : ''}`}>
        <span className="turn-dot" />
        <div style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: 3 }}>
          <span className="pname">{oppName} <span className="ptag">({opponentColor})</span></span>
          <CapturedRow pieces={captured && captured[opponentColor]}
                       victimColor={myColor} adv={advFor(opponentColor)} />
        </div>
        <span className="ptag">{opponentColor === 'white' ? '♔' : '♚'}</span>
      </div>

      {/* share strip — white waiting for opponent */}
      {gameId && status === 'waiting' && myColor === 'white' && (
        <div className="card share-strip">
          <span>Share ID:</span>
          <code className="share-code">{gameId}</code>
          <button className="copy-btn" title="Copy" onClick={onCopy}>⊕</button>
        </div>
      )}

      {/* board */}
      <div className="board-area">
        <div className="board-with-bar">
          <div className="adv-bar">
            <div className="adv-b" style={{height: `${materialAdv(board).bPct}%`}} />
            <div className="adv-w" style={{height: `${materialAdv(board).wPct}%`}} />
          </div>
          <div className="board-wrap">
            <Board board={board} myColor={myColor} turn={turn} status={status}
              selected={selected} legalMoves={legalMoves} lastMove={lastMove}
              onSquareClick={onSquareClick} />
          </div>
        </div>
      </div>

      {/* you */}
      <div className={`card player-row ${myTurn && gameStarted ? 'active' : ''}`}>
        <span className="turn-dot" />
        <div style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: 3 }}>
          <span className="pname">{myName} <span className="ptag">({myColor} — you)</span></span>
          <CapturedRow pieces={captured && captured[myColor]}
                       victimColor={opponentColor} adv={advFor(myColor)} />
        </div>
        <span className="ptag">{myColor === 'white' ? '♔' : '♚'}</span>
      </div>

      <div className={`status-badge ${status}`}>{statusLabel}</div>

      {msg && <div className={`msg ${msg.err ? 'err' : 'ok'}`}>{msg.text}</div>}

      {gameOver && (
        <button className="btn btn-primary" style={{ maxWidth: 200 }} onClick={onNewGame}>
          New Game
        </button>
      )}
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────────────────
const EMPTY_BOARD = Array(8).fill(null).map(() => Array(8).fill(null));

function App() {
  const [tweaks, setTweaksState] = useState({ accent: '#3b6ea5', theme: 'warm', sketch: true });
  const setTweak = (k, v) => setTweaksState(prev => ({ ...prev, [k]: v }));

  useEffect(() => {
    document.documentElement.style.setProperty('--accent', tweaks.accent);
    document.documentElement.setAttribute('data-theme', tweaks.theme);
    document.documentElement.setAttribute('data-sketch', tweaks.sketch ? 'on' : 'off');
  }, [tweaks.accent, tweaks.theme, tweaks.sketch]);

  const [gameCount, setGameCount] = useState(0);
  useEffect(() => {
    const poll = () => fetch('/stats').then(r => r.json()).then(d => setGameCount(d.games)).catch(() => {});
    poll();
    const id = setInterval(poll, 5000);
    return () => clearInterval(id);
  }, []);

  // phase: lobby | game | history | replay
  const [phase, setPhase] = useState('lobby');
  const [myColor, setMyColor]     = useState(null);
  const [gameId, setGameId]       = useState(null);
  const [turn, setTurn]           = useState(null);
  const [status, setStatus]       = useState('waiting');
  const [board, setBoard]         = useState(EMPTY_BOARD);
  const [selected, setSelected]   = useState(null);
  const [legalMoves, setLegalMoves] = useState([]);
  const [lastMove, setLastMove]   = useState(null);
  const [msg, setMsg]             = useState(null);
  const [gameStarted, setGameStarted] = useState(false);
  const [players, setPlayers]     = useState(null);
  const [captured, setCaptured]   = useState({ white: [], black: [] });

  // auth
  const [user, setUser]           = useState(null);
  const [clientId, setClientId]   = useState(null);
  const [replayGame, setReplayGame] = useState(null);

  useEffect(() => {
    fetch('/auth/config').then(r => r.json())
      .then(d => setClientId(d.google_client_id)).catch(() => {});
    fetch('/auth/me').then(r => r.json())
      .then(d => setUser(d.user)).catch(() => {});
  }, []);

  const onLogout = useCallback(() => {
    fetch('/auth/logout', { method: 'POST' }).then(() => setUser(null)).catch(() => {});
  }, []);

  const wsRef = useRef(null);
  // stable refs so event handlers don't capture stale closures
  const myColorRef     = useRef(null);
  const turnRef        = useRef(null);
  const boardRef       = useRef(EMPTY_BOARD);
  const legalMovesRef  = useRef([]);
  const selectedRef    = useRef(null);
  const gameStartedRef = useRef(false);

  myColorRef.current    = myColor;
  turnRef.current       = turn;
  boardRef.current      = board;
  legalMovesRef.current = legalMoves;
  selectedRef.current   = selected;
  gameStartedRef.current = gameStarted;

  const showMsg = useCallback((text, err = false) => {
    setMsg({ text, err });
    setTimeout(() => setMsg(null), 3500);
  }, []);

  const handle = useCallback((m) => {
    switch (m.type) {
      case 'joined':
        setMyColor(m.color);
        setGameId(m.game_id);
        setPhase('game');
        setStatus('waiting');
        setGameStarted(false);
        setBoard(EMPTY_BOARD);
        setSelected(null);
        setLegalMoves([]);
        setLastMove(null);
        setPlayers(null);
        setCaptured({ white: [], black: [] });
        break;

      case 'state':
        setGameStarted(true);
        setBoard(m.board);
        setTurn(m.turn);
        setStatus(m.status);
        setSelected(null);
        setLegalMoves([]);
        if (m.players) setPlayers(m.players);
        if (m.captured) setCaptured(m.captured);
        if (m.lastMove) setLastMove(m.lastMove);
        if (m.status === 'checkmate') {
          const winner = m.turn === 'white' ? 'Black' : 'White';
          showMsg(`${winner} wins by checkmate!`);
        } else if (m.status === 'stalemate') {
          showMsg("Stalemate — it's a draw!");
        }
        break;

      case 'possible_moves':
        setLegalMoves(m.moves);
        break;

      case 'error':
        showMsg(m.message, true);
        break;

      case 'opponent_disconnected':
        showMsg('Opponent disconnected.', true);
        break;
    }
  }, [showMsg]);

  const connect = useCallback((onOpen) => {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const ws = new WebSocket(`${proto}://${location.host}/ws`);
    ws.onopen = onOpen;
    ws.onmessage = e => handle(JSON.parse(e.data));
    ws.onclose = () => showMsg('Disconnected.', true);
    ws.onerror = () => showMsg('Connection error.', true);
    wsRef.current = ws;
  }, [handle, showMsg]);

  const send = useCallback((obj) => {
    const ws = wsRef.current;
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
  }, []);

  const onSquareClick = useCallback((row, col) => {
    if (!gameStartedRef.current || turnRef.current !== myColorRef.current) return;
    const legalSet = new Set(legalMovesRef.current.map(m => `${m.x},${m.y}`));

    if (selectedRef.current && legalSet.has(`${row},${col}`)) {
      send({ type: 'move',
             from: { x: selectedRef.current.row, y: selectedRef.current.col },
             to:   { x: row, y: col } });
      setSelected(null);
      setLegalMoves([]);
      return;
    }

    const piece = boardRef.current && boardRef.current[row][col];
    if (piece && piece.color === myColorRef.current) {
      setSelected({ row, col });
      setLegalMoves([]);
      send({ type: 'moves', x: row, y: col });
    } else {
      setSelected(null);
      setLegalMoves([]);
    }
  }, [send]);

  const onCreate = useCallback(() => connect(() => send({ type: 'create' })), [connect, send]);
  const onJoin   = useCallback((gid) => connect(() => send({ type: 'join', game_id: gid })), [connect, send]);
  const onNewGame = useCallback(() => {
    wsRef.current?.close();
    setPhase('lobby'); setMyColor(null); setGameId(null);
    setTurn(null); setStatus('waiting'); setBoard(EMPTY_BOARD);
    setSelected(null); setLegalMoves([]); setLastMove(null);
    setMsg(null); setGameStarted(false);
    setPlayers(null); setCaptured({ white: [], black: [] });
  }, []);
  const onCopy = useCallback(() => {
    navigator.clipboard.writeText(gameId).then(() => showMsg('Copied!'));
  }, [gameId, showMsg]);

  const connected = phase === 'game';

  return (
    <>
      <header className="topbar">
        <div className="brand">
          <span className="brand-name">parallel</span>
          <span className="brand-sub">— chess</span>
          {gameCount > 0 && (
            <span className="games-live">
              <span className="live-dot" />
              {gameCount} {gameCount === 1 ? 'game' : 'games'} live
            </span>
          )}
        </div>
        <span className="auth-box">
          {user && (
            <>
              {user.picture && <img className="avatar" src={user.picture} alt="" referrerPolicy="no-referrer" />}
              <span className="auth-name">{user.name}</span>
              <button className="linklike" onClick={onLogout}>sign out</button>
            </>
          )}
          <span className="livecount">
            <span className={`live-dot ${connected ? '' : 'dim'}`} />
            {connected ? 'connected' : 'offline'}
          </span>
        </span>
      </header>
      <hr className="divider" />

      {phase === 'lobby' &&
        <Lobby onCreate={onCreate} onJoin={onJoin} msg={msg}
          user={user} clientId={clientId} onUser={setUser}
          onAuthError={(e) => showMsg(e, true)}
          onMyGames={() => setPhase('history')} />}
      {phase === 'game' &&
        <GameView
          myColor={myColor} turn={turn} status={status} board={board}
          selected={selected} legalMoves={legalMoves} lastMove={lastMove}
          gameId={gameId} gameStarted={gameStarted} msg={msg}
          players={players} captured={captured} user={user}
          onSquareClick={onSquareClick} onNewGame={onNewGame} onCopy={onCopy} />}
      {phase === 'history' &&
        <MyGames onBack={() => setPhase('lobby')}
          onReplay={(g) => { setReplayGame(g); setPhase('replay'); }} />}
      {phase === 'replay' && replayGame &&
        <Replay game={replayGame} onBack={() => setPhase('history')} />}

      <TweaksPanel tweaks={tweaks} setTweak={setTweak} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>

[package]
name = "stress"
version = "0.1.0"
edition = "2024"

[dependencies]
chess = { path = ".." }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = "0.3"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
hdrhistogram = "7"
anyhow = "1"

[[bin]]
name = "stress"
path = "src/main.rs"

[package]
name = "chess"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
mongodb = "3.7.0"
serde = { version = "1.0.228", features = ["derive"] }
dotenvy = "0.15.7"
